<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">BinaryIQ premium technology logo</title>
  <desc id="desc">A refined fingerprint and circuit mark beside the BinaryIQ wordmark.</desc>

  <defs>
    <linearGradient id="brand" x1="40" y1="68" x2="1250" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D91A98"/>
      <stop offset="0.45" stop-color="#9A268F"/>
      <stop offset="1" stop-color="#4A2B9D"/>
    </linearGradient>
    <linearGradient id="mark" x1="48" y1="45" x2="287" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E027A3"/>
      <stop offset="0.5" stop-color="#9D278F"/>
      <stop offset="1" stop-color="#4A2B9D"/>
    </linearGradient>
  </defs>

  <!-- Premium fingerprint mark -->
  <g id="mark" fill="none" stroke="url(#mark)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer fingerprint shell -->
    <path d="M64 151C72 88 119 43 176 43c58 0 105 43 116 103"/>
    <path d="M49 195c-2-14-1-28 2-41"/>
    <path d="M302 169c5 20 5 40 1 59"/>
    <path d="M59 249c-12-18-18-38-18-59"/>
    <path d="M288 250c-8 23-21 44-38 61"/>
    <path d="M91 302c-18-14-32-31-42-51"/>
    <path d="M249 308c-18 15-39 25-62 31"/>
    <path d="M135 339c-13-4-25-9-37-16"/>

    <!-- clean middle ridges -->
    <path d="M88 157c1-44 39-80 85-80 45 0 83 34 88 79"/>
    <path d="M80 211c-7-14-10-29-9-45"/>
    <path d="M260 206c2 22-4 43-17 61"/>
    <path d="M108 264c-15-17-23-38-23-60"/>
    <path d="M231 274c-13 15-30 26-49 31"/>
    <path d="M143 313c-15-5-28-13-39-24"/>

    <!-- central whorl -->
    <path d="M176 112c-34 0-61 27-61 60 0 34 27 61 61 61 34 0 61-27 61-61 0-16-6-30-16-41"/>
    <path d="M176 139c-18 0-33 15-33 33s15 33 33 33 33-15 33-33c0-8-3-16-8-22"/>
    <path d="M176 233v82"/>
    <path d="M176 315c-10 0-20-1-29-4"/>
    <path d="M176 233c-30 0-55-25-55-55"/>
    <path d="M176 233c30 0 55-25 55-55"/>

    <!-- restrained circuit breaks -->
    <path d="M107 90l-17 19"/>
    <path d="M244 94l16 20"/>
    <path d="M298 127h20"/>
    <path d="M72 285l17 15"/>
    <path d="M253 179h24"/>
    <path d="M253 197h16"/>
  </g>

  <!-- small data-node detail -->
  <g fill="url(#brand)">
    <rect x="302" y="119" width="10" height="10" rx="2"/>
    <rect x="302" y="135" width="10" height="10" rx="2"/>
  </g>

  <!-- Geometric wordmark -->
  <g font-family="Avenir Next, Montserrat, Poppins, Segoe UI, Arial, sans-serif"
     font-size="128" font-weight="600" letter-spacing="-4">
    <text x="390" y="260" fill="url(#brand)">Binary<tspan fill="#582C9F" dx="3">IQ</tspan></text>
  </g>
</svg>
services:
  postgres:
    image: postgres:15
    container_name: binaryiq-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: binaryiq
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d binaryiq']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: binaryiq-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}

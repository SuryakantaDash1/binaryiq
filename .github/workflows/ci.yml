name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @binaryiq/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: binaryiq
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d binaryiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/binaryiq?schema=public
      DIRECT_URL: postgresql://app:app@localhost:5432/binaryiq?schema=public
      REDIS_URL: redis://localhost:6379
      SEED_SUPERADMIN_EMAIL: admin@binaryiq.app
      SEED_SUPERADMIN_PASSWORD: change-me-in-ci-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @binaryiq/db generate
      # The schema is managed with `prisma db push` (prisma/migrations stops at
      # 0007 and no longer matches schema.prisma), so build the test DB the same way.
      - run: pnpm --filter @binaryiq/db exec prisma db push --skip-generate
      - run: pnpm --filter @binaryiq/db seed
      - run: pnpm --filter @binaryiq/api test:integration
